name: Feature Request
description: Suggest an idea or enhancement for SaathiCare
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to SaathiCare!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: target-role
    attributes:
      label: Target Persona Beneficiary
      options:
        - Elderly Individuals
        - Family Members
        - Professional Caretakers
        - Clinicians / Doctors
        - All Roles
